services:
  - type: web
    name: caraccident
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALERT_RADIUS_KM
        value: 5
